name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Unzip project
        shell: bash
        run: |
          if [ -f lukochuri.zip ]; then python -m zipfile -e lukochuri.zip . && cp -r lukochuri/. . ; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Unzip project
        shell: bash
        run: |
          if [ -f lukochuri.zip ]; then python -m zipfile -e lukochuri.zip . && cp -r lukochuri/. . ; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, path: release/*.exe }
  mac:
    runs-on: macos-latest
    env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Unzip project
        shell: bash
        run: |
          if [ -f lukochuri.zip ]; then python -m zipfile -e lukochuri.zip . && cp -r lukochuri/. . ; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with: { name: mac-dmg, path: release/*.dmg }
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Unzip project
        shell: bash
        run: |
          if [ -f lukochuri.zip ]; then python -m zipfile -e lukochuri.zip . && cp -r lukochuri/. . ; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - run: npx cap add ios && npx cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - run: cd build/Build/Products/Debug-iphonesimulator && zip -r $GITHUB_WORKSPACE/ios-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with: { name: ios-simulator, path: ios-simulator.zip }
