<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>গ্রামের লুকোচুরি</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#16301f;font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;border:0;border-radius:12px;padding:.6em 1em;background:#2c5a3d;color:#fff;font-weight:600;cursor:pointer}
button.y{background:#f2b134;color:#2a1c00}
button:disabled{opacity:.4}
input{font:inherit;border:2px solid #2c5a3d;border-radius:12px;padding:.6em .8em;background:#0f2216;color:#fff;width:100%;user-select:text;-webkit-user-select:text}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,25,15,.72);padding:16px;z-index:5}
.card{background:#16301f;border:2px solid #f2b134;border-radius:20px;padding:20px;width:min(440px,100%);max-height:92vh;overflow:auto;display:grid;gap:12px;text-align:center;touch-action:pan-y}
.card h1{font-size:2.1rem;color:#f2b134;line-height:1.2}
.card small,#lobby small{opacity:.75}
.row{display:flex;gap:8px}
.ol{display:grid;max-height:22vh;overflow:auto}
.ol-i{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff22;text-align:left}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:max(8px,env(safe-area-inset-top)) 10px 0}
#top button{pointer-events:auto}
#ph{font-weight:700;background:#16301fcc;padding:.4em .9em;border-radius:99px}
#sub{text-align:center;margin-top:6px;text-shadow:0 1px 3px #000}
#lobby{position:fixed;left:10px;top:64px;width:min(270px,62vw);max-height:48vh;overflow:auto;background:#16301fe6;border-radius:16px;padding:12px;display:grid;gap:8px;z-index:4;touch-action:pan-y}
#joy{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff66;z-index:4}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:#f2b134;transform:translate(-50%,-50%)}
#catch{position:fixed;right:24px;bottom:34px;width:110px;height:110px;border-radius:50%;background:#a83232;font-size:1.4rem;z-index:4}
#catch.ready{background:#ff2d2d;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{font-size:1.7rem;padding:1em}
.pick button.on{background:#f2b134;color:#2a1c00;outline:3px solid #fff}
#coinwrap{perspective:700px;height:160px;display:grid;place-items:center}
#coin{width:110px;height:110px;position:relative;transform-style:preserve-3d}
#coin b{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:radial-gradient(#ffe08a,#e0a21b);color:#5a3b00;border:5px solid #b97a00}
#coin b+b{transform:rotateX(180deg)}
#coin.flip{animation:toss 3.2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes toss{0%{transform:translateY(0) rotateX(0)}45%{transform:translateY(-30vh) rotateX(calc(var(--end)/2))}100%{transform:translateY(0) rotateX(var(--end))}}
#coinres{opacity:0;font-size:1.5rem;font-weight:700;color:#f2b134}
#coinres.show{animation:fi .4s 3.3s forwards}
@keyframes fi{to{opacity:1}}
.black{background:#000;font-size:2.6rem;text-align:center;z-index:6}
#toast{position:fixed;left:50%;bottom:22vh;transform:translateX(-50%);background:#000c;padding:.6em 1.1em;border-radius:99px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
#inv{position:fixed;top:64px;right:10px;background:#16301f;border:2px solid #f2b134;border-radius:14px;padding:12px;z-index:8;display:grid;gap:8px;max-width:70vw}
#morph{position:fixed;right:20px;bottom:34px;width:96px;height:96px;border-radius:50%;font-size:1.3rem;z-index:4}
#skins{position:fixed;right:10px;bottom:140px;width:min(330px,92vw);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#16301fee;padding:10px;border-radius:16px;z-index:6}
#sig{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font-size:3.4rem;font-weight:800;color:#f2b134;text-shadow:0 2px 12px #000;z-index:7;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="top"><button id="code"></button><div id="ph"></div><button id="leave">বের হন</button></div>
  <div id="sub"></div>
</div>
<div id="joy" hidden><i id="knob"></i></div>
<button id="catch" hidden>ধরো</button>
<button id="morph" class="y" hidden>রূপ</button>
<div id="skins" hidden></div>
<div id="sig" hidden>ডু!</div>

<div id="lobby" hidden>
  <div id="pl"></div>
  <button id="start" class="y">খেলা শুরু করুন</button>
  <small id="wait">হোস্ট (★) খেলা শুরু করবেন</small>
  <b>অনলাইনে ডাকুন</b>
  <div id="olLobby" class="ol"></div>
</div>

<div id="toss" class="ov" hidden><div class="card">
  <h2>টস • <span id="ttime"></span> সেকেন্ড</h2>
  <p id="tmsg"></p>
  <div class="pick"><button id="pickH">হেড</button><button id="pickT">টেল</button></div>
  <small id="tinfo"></small>
  <small>যে পাশে বেশি জন থাকবে তারা বাদ পড়বে (তারা লুকাবে)। শেষে ২ জন থাকলে কয়েন টস হবে।</small>
</div></div>

<div id="coinov" class="ov" hidden><div class="card">
  <h2>কয়েন টস!</h2>
  <div id="coinwrap"><div id="coin"><b>হেড</b><b>টেল</b></div></div>
  <p id="coinwho"></p><p id="coinres"></p>
</div></div>

<div id="blind" class="ov black" hidden></div>
<div id="end" class="ov" hidden></div>

<div id="menu" class="ov"><div class="card">
  <h1>গ্রামের লুকোচুরি</h1>
  <p>৩ডি অনলাইন হাইড অ্যান্ড সিক</p>
  <input id="name" placeholder="আপনার নাম" maxlength="14">
  <button id="create" class="y">নতুন রুম বানান</button>
  <div class="row"><input id="jc" placeholder="রুমের ঠিকানা" maxlength="5" style="text-transform:uppercase"><button id="join">ঢুকুন</button></div>
  <button id="pub">অনলাইনে যে কারও সাথে খেলুন</button>
  <b>এখন অনলাইনে: <span id="olN"></span></b>
  <div id="olMenu" class="ol"></div>
</div></div>

<div id="inv" hidden></div>
<div id="toast"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
